# XcodeGen spec. The .xcodeproj is generated in CI with `xcodegen generate`
# and is never committed.
name: Cresta

options:
  bundleIdPrefix: com.garoth93
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  CrestaCore:
    path: ../../packages/CrestaCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is empty here on purpose:
    # - testflight.yml overrides it on the command line (Automatic, team from
    #   the APPLE_TEAM_ID secret, profiles via the App Store Connect API key);
    # - build-ipa.yml (Sideloadly fallback) builds with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Strava API credentials: empty here, injected by CI from the repository
    # secrets STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET (or typed in the app).
    STRAVA_CLIENT_ID: ""
    STRAVA_CLIENT_SECRET: ""

targets:
  Cresta:
    type: application
    platform: iOS
    # Tells Xcode's automatic signing which capabilities the App ID needs.
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: CrestaCore
        product: CrestaCore
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: UserNotifications.framework
      - sdk: AuthenticationServices.framework
      - sdk: BackgroundTasks.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.cresta
        PRODUCT_NAME: Cresta
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist   # generated by XcodeGen from the properties below (git-ignored)
      properties:
        CFBundleDisplayName: Cresta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait only: App Store validation (error 90474) requires full screen.
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        NSLocationWhenInUseUsageDescription: "Cresta usa la posizione per mostrarti le vette e il meteo vicino a te."
        NSPhotoLibraryUsageDescription: "Cresta aggiunge alle uscite le foto che scegli."
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.garoth93.cresta.sync
        StravaClientID: $(STRAVA_CLIENT_ID)
        StravaClientSecret: $(STRAVA_CLIENT_SECRET)
        CFBundleURLTypes:
          - CFBundleURLName: com.garoth93.cresta
            CFBundleURLSchemes:
              - cresta
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
          - UTTypeIdentifier: com.garmin.fit
            UTTypeDescription: FIT
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
          - UTTypeIdentifier: com.garmin.tcx
            UTTypeDescription: TCX
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tcx]

schemes:
  Cresta:
    build:
      targets:
        Cresta: all
    run:
      config: Debug
    archive:
      config: Release
