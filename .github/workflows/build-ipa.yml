name: build-ipa

# Builds every app in apps/ for a real iOS device WITHOUT code signing and
# uploads an unsigned .ipa as a workflow artifact. The .ipa is then signed
# on the user's side with Sideloadly / SideStore (free Apple account).

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

env:
  XCODE_VERSION: "26.6"   # pinned; see CLAUDE.md "Xcode e runner"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          apps=$(ls -d apps/*/ | xargs -n1 basename | jq -R . | jq -cs .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Apps: $apps"

  # Offline OSM databases (peaks, passes, ski areas), refreshed monthly (cached).
  peaks:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache-peaks
        with:
          path: peaks.tsv
          key: osm-peaks-v1-${{ steps.month.outputs.month }}
          restore-keys: osm-peaks-v1-
      - name: Download peaks (Overpass API)
        if: steps.cache-peaks.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: python3 scripts/fetch_peaks.py peaks.tsv.new peaks && mv peaks.tsv.new peaks.tsv

      - uses: actions/cache@v4
        id: cache-passes
        with:
          path: passes.tsv
          key: osm-passes-v1-${{ steps.month.outputs.month }}
          restore-keys: osm-passes-v1-
      - name: Download passes (Overpass API)
        if: steps.cache-passes.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        run: python3 scripts/fetch_peaks.py passes.tsv.new passes && mv passes.tsv.new passes.tsv

      - uses: actions/cache@v4
        id: cache-skiareas
        with:
          path: skiareas.tsv
          key: osm-skiareas-v1-${{ steps.month.outputs.month }}
          restore-keys: osm-skiareas-v1-
      - name: Download ski areas (Overpass API)
        if: steps.cache-skiareas.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        run: python3 scripts/fetch_peaks.py skiareas.tsv.new skiareas && mv skiareas.tsv.new skiareas.tsv

      - name: Check
        run: |
          mkdir -p out
          for f in peaks passes skiareas; do
            if [ -s "$f.tsv" ]; then wc -l "$f.tsv"; cp "$f.tsv" "out/$f.tsv"
            else echo "::warning::$f.tsv mancante: l'app proporrà il download dalla mappa"; touch "out/$f.tsv"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: osm-peaks
          path: out/*.tsv
          retention-days: 7

  build:
    needs: [discover, peaks]
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: osm-peaks
          path: peaks-download

      - name: Bundle OSM databases
        run: |
          for f in peaks passes skiareas; do
            if [ -s "peaks-download/$f.tsv" ] && [ -d "apps/${{ matrix.app }}/Resources" ]; then
              cp "peaks-download/$f.tsv" "apps/${{ matrix.app }}/Resources/$f.tsv"
              wc -l "apps/${{ matrix.app }}/Resources/$f.tsv"
            fi
          done

      - uses: ./.github/actions/setup-xcode
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          app: ${{ matrix.app }}

      - name: Build for iOS device (unsigned, Release)
        working-directory: apps/${{ matrix.app }}
        env:
          # Optional repository secrets; empty = credentials typed in the app.
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project "${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            STRAVA_CLIENT_ID="${STRAVA_CLIENT_ID}" \
            STRAVA_CLIENT_SECRET="${STRAVA_CLIENT_SECRET}" \
            | tee build/xcodebuild-device.log | xcbeautify --renderer github-actions

      - name: Package unsigned .ipa
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/${{ matrix.app }}.app"
          test -d "$APP_PATH" || { echo "::error::$APP_PATH not found"; ls -R build/DerivedData/Build/Products; exit 1; }
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          PAYLOAD_APP="build/ipa/Payload/${{ matrix.app }}.app"
          if [ -f "${{ matrix.app }}.entitlements" ]; then
            codesign --force --sign - --timestamp=none --entitlements "${{ matrix.app }}.entitlements" "$PAYLOAD_APP"
          fi
          ls -lh "$PAYLOAD_APP"/peaks.tsv 2>/dev/null || echo "no bundled peaks"
          (cd build/ipa && zip -qry "../${{ matrix.app }}-unsigned.ipa" Payload)
          ls -lh "build/${{ matrix.app }}-unsigned.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-unsigned-ipa
          path: apps/${{ matrix.app }}/build/${{ matrix.app }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-device-log-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/xcodebuild-device.log
          if-no-files-found: ignore
          retention-days: 7
